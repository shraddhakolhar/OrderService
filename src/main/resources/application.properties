# ===============================
# Service configuration
# ===============================
spring.application.name=ORDER-SERVICE
server.port=8483

# ===============================
# Eureka client configuration
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ===============================
# Database configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/orderservicedb
spring.datasource.username=orderservice
spring.datasource.password=S2011nppd

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.type=trace

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true

# ===============================
# JWT (must match User + Cart)
# ===============================
jwt.secret=VGhpc0lzQVN1cGVyU2VjdXJlMjU2Qml0S2V5MTIzNDU2
jwt.expiration=3600000

# ===============================
# Logging & errors
# ===============================
logging.level.org.springframework.security=TRACE
server.error.include-message=always
server.error.include-binding-errors=always
